services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nypd_data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nypd_data"]
      interval: 5s
      timeout: 5s
      retries: 5
